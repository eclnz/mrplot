[project]
name = "mrplot"
version = "0.1.0"
description = "A lightweight package for plotting 3D and higher dimensional MRI volumes."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "imageio>=2.37.0",
    "imageio-ffmpeg>=0.6.0",
    "nibabel>=5.3.2",
    "numpy>=2.2.2",
    "pillow>=11.1.0",
]

[project.scripts]
mrplot = "mrplot.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.15.0",
    "pytest>=8.3.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mrplot"]

[tool.mypy]
strict = true
packages = ["mrplot"]

[[tool.mypy.overrides]]
module = ["imageio.*", "imageio_ffmpeg.*", "PIL.*"]
ignore_missing_imports = true
follow_imports = "skip"
